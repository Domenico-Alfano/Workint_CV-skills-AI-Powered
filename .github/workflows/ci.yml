# Fast suite on every push/PR: pure functions, contract tests, mocks — by construction
# it needs neither the DB nor the embedding model (integration tests are deselected and
# would self-skip anyway). Heavy deps (torch) are cached by setup-python's pip cache.
name: ci

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m "not integration" -q
